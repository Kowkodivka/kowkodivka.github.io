[package]
name = "kowkodivka"
version = "0.1.0"
authors = ["Kowkodivka <kowkodivka@gmail.com>"]
edition = "2024"

[dependencies]
dioxus = { version = "0.7.1", features = [] }
dioxus-free-icons = { version = "0.10.0", features = ["lucide"] }
fastrand = "2.5.0"
gloo-timers = { version = "0.4.1", features = ["futures"] }
js-sys = "0.3.107"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = [
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "DomRect",
    "Element",
    "HtmlCanvasElement",
    "MediaQueryList",
    "Window",
    "Document",
    "Navigator",
    "Storage",
] }

[features]
default = ["web"]
web = ["dioxus/web"]
